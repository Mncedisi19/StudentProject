<!DOCTYPE html>
<html>
 <head>
     <link rel="stylesheet" href="style.css">
    <body>
        
        <h2>Create your account</h2>
        <p>Start studying smarter today</p>

<form>   <!-- Collecting user details-->
  <label for="First Name">First Name:</label>
  <input type="text" id="First Name" placeholder="Enter first name" required>

  <label for="Last Name">Last Name:</label>
  <input type="text" id="Last Name" placeholder="Enter last name" required>

  <label for="email">Email:</label>
  <input type="email" id="email" placeholder="studentnumber@example.ac.za" required>

  <label for="phone">Phone Number:</label>
  <input type="tel" id="phone" placeholder="Enter phone number" required>


  <label for="password">Password:</label>
  <input type="password" id="password" placeholder="Enter password" required>

  <label for="confirm password"></label>
  <input type="password" id="confirm password" placeholder="Confirm password" required>

  <label for="role">I am a</label>
  <select id="role" required>
    <option value="">Select your role</option>
    <option value="student">Student</option>
    <option value="Learner">Learner</option>
  </select>
 <br>
  <button type="submit">Sign up</button>
</form>
        <p>or continue with</p>

        <div>
            <button onclick="signInWithGitHub()"><a href="#">GitHub</a></button>
            <button onclick="signInWithGoogle()"><a href="#">Google</a></button>
        </div>

        <p>Already have an account? <a href="https://mncedisi19.github.io/StudentProject/login.html">Sign in</a></p>
     <script src="app.js"></script>   
    </body>
 </head>
 </html>
